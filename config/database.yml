_default: &default
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  adapter: 'postgresql'
  encoding: utf-8
  username: <%= ENV.fetch("DB_USER", "bulk_pay") %>
  password: <%= ENV.fetch("DB_PASS", "") %>
  pool: <%= ENV.fetch("MAX_THREADS", 5) %> # must be >= puma threads per process, see config/puma.rb
  connect_timeout: 2
  variables:
    # backstop: a stuck request must not keep firm rows locked forever
    idle_in_transaction_session_timeout: 10s

development:
  <<: *default
  database: 'bulk_pay_dev'

test:
  <<: *default
  database: 'bulk_pay_test'

production:
  <<: *default
  database: 'bulk_pay'
