services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: bulk_pay
      POSTGRES_PASSWORD: ${DB_PASS:-bulk_pay}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bulk_pay"]
      interval: 2s
      retries: 15

  app:
    build: .
    environment:
      APP_ENV: production
      DB_HOST: db
      DB_USER: bulk_pay
      DB_PASS: ${DB_PASS:-bulk_pay}
      MAX_THREADS: 5
      WEB_CONCURRENCY: 2
    ports:
      - "${APP_PORT:-9292}:9292"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
